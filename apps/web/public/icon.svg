<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Foresight Matchmaking">
  <!--
    Matchmaker mark: a six-node molecular wheel on directory yellow.
    Reads as Foresight’s nanoscale heritage at a glance; at 16px it
    collapses to a bold radial silhouette that still holds the tab.
    Colours are the product tokens — mark (#edcf5a) and ink (#17150f) —
    and stay fixed (no prefers-color-scheme flip) so the yellow remains
    the recognisable signal on both light and dark browser chrome.
  -->
  <rect width="32" height="32" fill="#edcf5a"/>
  <g stroke="#17150f" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Hex perimeter -->
    <line x1="16" y1="7.5" x2="23.5" y2="11.8"/>
    <line x1="23.5" y1="11.8" x2="23.5" y2="20.2"/>
    <line x1="23.5" y1="20.2" x2="16" y2="24.5"/>
    <line x1="16" y1="24.5" x2="8.5" y2="20.2"/>
    <line x1="8.5" y1="20.2" x2="8.5" y2="11.8"/>
    <line x1="8.5" y1="11.8" x2="16" y2="7.5"/>
    <!-- Spokes into the hub — the match sits at the centre -->
    <line x1="16" y1="7.5" x2="16" y2="16"/>
    <line x1="23.5" y1="11.8" x2="16" y2="16"/>
    <line x1="23.5" y1="20.2" x2="16" y2="16"/>
    <line x1="16" y1="24.5" x2="16" y2="16"/>
    <line x1="8.5" y1="20.2" x2="16" y2="16"/>
    <line x1="8.5" y1="11.8" x2="16" y2="16"/>
  </g>
  <circle cx="16" cy="7.5" r="2.4" fill="#17150f"/>
  <circle cx="23.5" cy="11.8" r="2.4" fill="#17150f"/>
  <circle cx="23.5" cy="20.2" r="2.4" fill="#17150f"/>
  <circle cx="16" cy="24.5" r="2.4" fill="#17150f"/>
  <circle cx="8.5" cy="20.2" r="2.4" fill="#17150f"/>
  <circle cx="8.5" cy="11.8" r="2.4" fill="#17150f"/>
  <circle cx="16" cy="16" r="2.9" fill="#17150f"/>
</svg>
