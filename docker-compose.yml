# ---------------------------------------------------------------------------
# Foresight Matchmaking — single-container deployment for a Linux VM.
#
#   cp .env.example .env      # see DEPLOY.md for the YCluster values
#   docker compose up -d --build
#
# The SQLite database lives in ./data on the host (bind-mounted to /data);
# the container seeds the synthetic demo directory on first boot and never
# touches existing data.
# ---------------------------------------------------------------------------

services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/app.db
      SEED_ON_EMPTY: "true"
    volumes:
      # SQLite database persists on the host, next to the repo.
      - ./data:/data
    restart: unless-stopped
