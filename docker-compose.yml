# ---------------------------------------------------------------------------
# Foresight Matchmaking — single-container deployment for a Linux VM.
#
#   cp .env.example .env      # see DEPLOY.md (Vercel now; Hetzner/VM when ready)
#   docker compose up -d --build
#
# The SQLite database lives in ./data on the host (bind-mounted to /data).
# Production does not auto-seed fabricated profiles. Set SEED_ON_EMPTY=true
# in .env only for a local or rehearsal demo.
# ---------------------------------------------------------------------------

services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/app.db
    volumes:
      # SQLite database persists on the host, next to the repo.
      - ./data:/data
    restart: unless-stopped
